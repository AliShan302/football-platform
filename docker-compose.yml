services:

  db:
    image: postgres:16
    container_name: football_postgres
    environment:
      POSTGRES_DB: football
      POSTGRES_USER: football_user
      POSTGRES_PASSWORD: football_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: football_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
